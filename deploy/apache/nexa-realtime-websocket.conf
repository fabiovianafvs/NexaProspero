# Nexa Realtime - proxy WebSocket para o serviço local na porta 8081.
# Pode ser habilitado globalmente com a2enconf porque todos os tenants usam o mesmo gateway,
# e a separação por empresa é feita pelo token HMAC validado no serviço.
ProxyPreserveHost On
ProxyPass        "/brain-ws" "ws://127.0.0.1:8081/brain-ws" retry=0 timeout=70
ProxyPassReverse "/brain-ws" "ws://127.0.0.1:8081/brain-ws"
