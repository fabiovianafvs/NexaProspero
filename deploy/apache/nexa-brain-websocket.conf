# Requer: a2enmod proxy proxy_http proxy_wstunnel headers
# Inserir DENTRO do VirtualHost curinga que atende *.nexaprospero.com.br.
# No ambiente atual: segundo bloco de /etc/apache2/sites-available/nexaprospero.conf
ProxyPreserveHost On
ProxyPass        "/brain-ws" "ws://127.0.0.1:8081/brain-ws" retry=0 timeout=70
ProxyPassReverse "/brain-ws" "ws://127.0.0.1:8081/brain-ws"
